name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan every Sunday midnight

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit Production Dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Verify No Committed Secrets
        run: |
          if grep -rE "nvapi-[A-Za-z0-9_-]{32,}" src/ bin/; then
            echo "ERROR: Found real NVIDIA API key pattern in source tree!"
            exit 1
          fi
          echo "Secret scan passed cleanly."
